<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <h3 class="text-center mb-4">Student Registration</h3>
            <div id="alertBox" class="alert d-none"></div>
            <form id="registerForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="student_id" class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="student_id" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone">
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" minlength="8" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" minlength="8" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="registerBtn">Register</button>
                <div class="text-center mt-3">
                    <a href="login.html" class="text-decoration-none">Already have an account? Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const student_id = document.getElementById('student_id').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('registerBtn');

            if (password !== confirm_password) {
                alertBox.textContent = "Passwords do not match.";
                alertBox.classList.remove('d-none', 'alert-success');
                alertBox.classList.add('alert-danger');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Registering...';
                alertBox.classList.add('d-none');

                const data = await fetchApi('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, student_id, email, phone, password })
                });

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data));
                
                alertBox.textContent = "Registration successful! Redirecting...";
                alertBox.classList.remove('d-none', 'alert-danger');
                alertBox.classList.add('alert-success');

                setTimeout(() => {
                    window.location.href = 'student/student-dashboard.html';
                }, 1500);

            } catch (error) {
                alertBox.textContent = error.message;
                alertBox.classList.remove('d-none', 'alert-success');
                alertBox.classList.add('alert-danger');
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
