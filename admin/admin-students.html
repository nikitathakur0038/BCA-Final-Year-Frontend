<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html" class="active"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Students</h2>
            </div>

            <div id="alertBox" class="alert d-none"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                                <!-- Populated by JS -->
                                <tr><td colspan="5" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Student Edit Modal -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="studentName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="studentEmail" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveStudentBtn">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') window.location.href = '../student/student-dashboard.html';

        const studentModal = new bootstrap.Modal(document.getElementById('studentModal'));
        
        async function loadStudents() {
            try {
                // Assuming backend has a /users endpoint or similar for admin to fetch students
                const students = await fetchApi('/users?role=student');
                const tbody = document.getElementById('studentsTableBody');
                tbody.innerHTML = '';
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No students found</td></tr>';
                    return;
                }

                students.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td><span class="badge bg-primary">Student</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="editStudent(${student.id}, '${student.name.replace(/'/g, "\\'")}', '${student.email.replace(/'/g, "\\'")}')">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('alertBox').textContent = 'Failed to load students.';
                document.getElementById('alertBox').classList.remove('d-none');
                document.getElementById('alertBox').classList.add('alert-danger');
            }
        }

        function editStudent(id, name, email) {
            document.getElementById('studentId').value = id;
            document.getElementById('studentName').value = name;
            document.getElementById('studentEmail').value = email;
            studentModal.show();
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('studentName').value;
            const email = document.getElementById('studentEmail').value;
            const btn = document.getElementById('saveStudentBtn');

            btn.disabled = true;
            try {
                await fetchApi(`/users/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name, email })
                });
                studentModal.hide();
                loadStudents();
            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student? All their records will be lost.')) {
                try {
                    await fetchApi(`/users/${id}`, { method: 'DELETE' });
                    loadStudents();
                } catch (error) {
                    alert(error.message);
                }
            }
        }

        loadStudents();
    </script>
</body>
</html>
