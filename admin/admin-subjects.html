<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html" class="active"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Subjects</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#subjectModal" onclick="openSubjectModal()">
                    <i class="bi bi-plus-circle me-1"></i> Add Subject
                </button>
            </div>

            <div id="alertBox" class="alert d-none"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Subject Name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="subjectsTableBody">
                                <!-- Populated by JS -->
                                <tr><td colspan="4" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Subject Modal -->
    <div class="modal fade" id="subjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="subjectModalTitle">Add Subject</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="subjectForm">
                        <input type="hidden" id="subjectId">
                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input type="text" class="form-control" id="subjectName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="subjectDesc" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveSubjectBtn">Save Subject</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') window.location.href = '../student/student-dashboard.html';

        const subjectModal = new bootstrap.Modal(document.getElementById('subjectModal'));
        
        async function loadSubjects() {
            try {
                const subjects = await fetchApi('/subjects');
                const tbody = document.getElementById('subjectsTableBody');
                tbody.innerHTML = '';
                
                if (subjects.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No subjects found</td></tr>';
                    return;
                }

                subjects.forEach(sub => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${sub.id}</td>
                        <td>${sub.name}</td>
                        <td>${sub.description || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="editSubject(${sub.id}, '${sub.name.replace(/'/g, "\\'")}', '${(sub.description || '').replace(/'/g, "\\'")}')">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSubject(${sub.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('alertBox').textContent = 'Failed to load subjects.';
                document.getElementById('alertBox').classList.remove('d-none');
                document.getElementById('alertBox').classList.add('alert-danger');
            }
        }

        function openSubjectModal() {
            document.getElementById('subjectForm').reset();
            document.getElementById('subjectId').value = '';
            document.getElementById('subjectModalTitle').textContent = 'Add Subject';
        }

        function editSubject(id, name, desc) {
            document.getElementById('subjectId').value = id;
            document.getElementById('subjectName').value = name;
            document.getElementById('subjectDesc').value = desc;
            document.getElementById('subjectModalTitle').textContent = 'Edit Subject';
            subjectModal.show();
        }

        document.getElementById('subjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('subjectId').value;
            const name = document.getElementById('subjectName').value;
            const description = document.getElementById('subjectDesc').value;
            const btn = document.getElementById('saveSubjectBtn');

            btn.disabled = true;
            try {
                if (id) {
                    await fetchApi(`/subjects/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ name, description })
                    });
                } else {
                    await fetchApi('/subjects', {
                        method: 'POST',
                        body: JSON.stringify({ name, description })
                    });
                }
                subjectModal.hide();
                loadSubjects();
            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteSubject(id) {
            if (confirm('Are you sure you want to delete this subject? Exams and questions related to it will also be deleted.')) {
                try {
                    await fetchApi(`/subjects/${id}`, { method: 'DELETE' });
                    loadSubjects();
                } catch (error) {
                    alert(error.message);
                }
            }
        }

        loadSubjects();
    </script>
</body>
</html>
