<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html" class="active"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Exams</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#examModal" onclick="openExamModal()">
                    <i class="bi bi-plus-circle me-1"></i> Create Exam
                </button>
            </div>

            <div id="alertBox" class="alert d-none"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Subject</th>
                                    <th>Duration</th>
                                    <th>Questions</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="examsTableBody">
                                <tr><td colspan="6" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Exam Modal -->
    <div class="modal fade" id="examModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="examModalTitle">Create Exam</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="examForm">
                        <input type="hidden" id="examId">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Exam Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Subject</label>
                                <select class="form-select" id="subject_id" required>
                                    <option value="">Select Subject</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Duration (mins)</label>
                                <input type="number" class="form-control" id="duration" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Total Questions</label>
                                <input type="number" class="form-control" id="total_questions" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Marks/Question</label>
                                <input type="number" step="0.5" class="form-control" id="marks" value="1.0" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Negative Marks</label>
                                <input type="number" step="0.1" class="form-control" id="negative_marks" value="0.0" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Pass Percentage</label>
                                <input type="number" class="form-control" id="passing_percentage" value="40" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Attempt Limit</label>
                                <input type="number" class="form-control" id="attempt_limit" value="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveExamBtn">Save Exam</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') window.location.href = '../student/student-dashboard.html';

        const examModal = new bootstrap.Modal(document.getElementById('examModal'));
        let subjectsList = [];

        async function loadInitialData() {
            try {
                subjectsList = await fetchApi('/subjects');
                const subjectSelect = document.getElementById('subject_id');
                subjectsList.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    subjectSelect.appendChild(opt);
                });
                await loadExams();
            } catch (error) {
                console.error('Failed to load initial data');
            }
        }

        async function loadExams() {
            try {
                const exams = await fetchApi('/exams');
                const tbody = document.getElementById('examsTableBody');
                tbody.innerHTML = '';
                
                if (exams.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No exams found</td></tr>';
                    return;
                }

                exams.forEach(exam => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${exam.title}</td>
                        <td>${exam.subject_name}</td>
                        <td>${exam.duration_minutes} mins</td>
                        <td>${exam.total_questions}</td>
                        <td>
                            <span class="badge ${exam.is_published ? 'bg-success' : 'bg-secondary'}">
                                ${exam.is_published ? 'Published' : 'Draft'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editExam(${exam.id})">Edit</button>
                            <button class="btn btn-sm ${exam.is_published ? 'btn-outline-warning' : 'btn-outline-success'}" onclick="togglePublish(${exam.id})">${exam.is_published ? 'Unpublish' : 'Publish'}</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteExam(${exam.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('alertBox').textContent = 'Failed to load exams.';
                document.getElementById('alertBox').classList.remove('d-none');
                document.getElementById('alertBox').classList.add('alert-danger');
            }
        }

        function openExamModal() {
            document.getElementById('examForm').reset();
            document.getElementById('examId').value = '';
            document.getElementById('examModalTitle').textContent = 'Create Exam';
        }

        async function editExam(id) {
            try {
                const exam = await fetchApi(`/exams/${id}`);
                document.getElementById('examId').value = exam.id;
                document.getElementById('title').value = exam.title;
                document.getElementById('subject_id').value = exam.subject_id;
                document.getElementById('description').value = exam.description;
                document.getElementById('duration').value = exam.duration_minutes;
                document.getElementById('total_questions').value = exam.total_questions;
                document.getElementById('marks').value = exam.marks_per_question;
                document.getElementById('negative_marks').value = exam.negative_marks;
                document.getElementById('passing_percentage').value = exam.passing_percentage;
                document.getElementById('attempt_limit').value = exam.attempt_limit;
                
                document.getElementById('examModalTitle').textContent = 'Edit Exam';
                examModal.show();
            } catch (error) {
                alert('Failed to load exam details');
            }
        }

        document.getElementById('examForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('examId').value;
            const data = {
                title: document.getElementById('title').value,
                subject_id: document.getElementById('subject_id').value,
                description: document.getElementById('description').value,
                duration_minutes: document.getElementById('duration').value,
                total_questions: document.getElementById('total_questions').value,
                marks_per_question: document.getElementById('marks').value,
                negative_marks: document.getElementById('negative_marks').value,
                passing_percentage: document.getElementById('passing_percentage').value,
                attempt_limit: document.getElementById('attempt_limit').value
            };

            const btn = document.getElementById('saveExamBtn');
            btn.disabled = true;

            try {
                if (id) {
                    await fetchApi(`/exams/${id}`, { method: 'PUT', body: JSON.stringify(data) });
                } else {
                    await fetchApi('/exams', { method: 'POST', body: JSON.stringify(data) });
                }
                examModal.hide();
                loadExams();
            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteExam(id) {
            if (confirm('Are you sure you want to delete this exam? All related attempts and questions will be lost.')) {
                try {
                    await fetchApi(`/exams/${id}`, { method: 'DELETE' });
                    loadExams();
                } catch (error) {
                    alert(error.message);
                }
            }
        }

        async function togglePublish(id) {
            try {
                await fetchApi(`/exams/${id}/publish`, { method: 'PATCH' });
                loadExams();
            } catch (error) {
                alert(error.message);
            }
        }

        loadInitialData();
    </script>
</body>
</html>
