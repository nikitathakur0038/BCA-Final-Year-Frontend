<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html" class="active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Admin Dashboard</h2>
            </div>

            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="card bg-primary text-white h-100 p-3 shadow-sm border-0">
                        <h5>Total Students</h5>
                        <h2 id="totalStudents">0</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-success text-white h-100 p-3 shadow-sm border-0">
                        <h5>Total Exams</h5>
                        <h2 id="totalExams">0</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-info text-white h-100 p-3 shadow-sm border-0">
                        <h5>Total Questions</h5>
                        <h2 id="totalQuestions">0</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-warning text-white h-100 p-3 shadow-sm border-0">
                        <h5>Total Attempts</h5>
                        <h2 id="totalAttempts">0</h2>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Recent Activity</h5>
                        </div>
                        <div class="card-body">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Exam</th>
                                        <th>Date</th>
                                        <th>Score</th>
                                    </tr>
                                </thead>
                                <tbody id="recentActivityBody">
                                    <!-- Populated by JS -->
                                    <tr><td colspan="4" class="text-center text-muted">No recent activity</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') {
            window.location.href = '../student/student-dashboard.html';
        }
    </script>
</body>
</html>
