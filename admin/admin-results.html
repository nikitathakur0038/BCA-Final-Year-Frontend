<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results & Analytics - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html" class="active"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <h2 class="mb-4">System Analytics & Results</h2>

            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-primary h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h5 class="card-title">Total Students</h5>
                            <h2 class="display-5 fw-bold" id="totalStudents">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-secondary h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h5 class="card-title">Total Exams</h5>
                            <h2 class="display-5 fw-bold" id="totalExams">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-info h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h5 class="card-title">Total Attempts</h5>
                            <h2 class="display-5 fw-bold" id="totalAttempts">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-success h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h5 class="card-title">Pass Rate</h5>
                            <h2 class="display-5 fw-bold" id="passRate">0%</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-4">Recent Exam Submissions</h5>
                    <button class="btn btn-sm btn-outline-secondary mb-3" onclick="window.print()">
                        <i class="bi bi-printer"></i> Print Report
                    </button>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Exam Title</th>
                                    <th>Score</th>
                                    <th>Percentage</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody">
                                <tr><td colspan="7" class="text-center py-4">Loading results...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') window.location.href = '../student/student-dashboard.html';

        async function loadAdminAnalytics() {
            try {
                const data = await fetchApi('/analytics/admin');
                
                document.getElementById('totalStudents').textContent = data.summary.totalStudents;
                document.getElementById('totalExams').textContent = data.summary.totalExams;
                document.getElementById('totalAttempts').textContent = data.summary.totalAttempts;
                document.getElementById('passRate').textContent = `${data.summary.passRate}%`;

                const tbody = document.getElementById('resultsTableBody');
                tbody.innerHTML = '';
                
                if (data.results.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No submissions yet.</td></tr>';
                    return;
                }

                data.results.forEach(r => {
                    const date = new Date(r.submitted_at).toLocaleString();
                    const passed = parseFloat(r.percentage) >= parseFloat(r.passing_percentage);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td class="fw-bold">${r.student_name}</td>
                        <td>${r.email}</td>
                        <td>${r.exam_title}</td>
                        <td>${r.score}</td>
                        <td>${r.percentage}%</td>
                        <td>
                            <span class="badge ${passed ? 'bg-success' : 'bg-danger'}">${passed ? 'Pass' : 'Fail'}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                alert('Failed to load admin analytics');
            }
        }

        loadAdminAnalytics();
    </script>
</body>
</html>
