<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Admin Panel</h4>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="admin-students.html"><i class="bi bi-people me-2"></i> Students</a>
            <a href="admin-subjects.html"><i class="bi bi-book me-2"></i> Subjects</a>
            <a href="admin-exams.html"><i class="bi bi-journal-check me-2"></i> Exams</a>
            <a href="admin-questions.html" class="active"><i class="bi bi-question-circle me-2"></i> Questions</a>
            <a href="admin-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Question Bank</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#questionModal" onclick="openQuestionModal()">
                    <i class="bi bi-plus-circle me-1"></i> Add Question
                </button>
            </div>

            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <select class="form-select" id="filterSubject" onchange="loadQuestions()">
                                <option value="">All Subjects</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="alertBox" class="alert d-none"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Subject</th>
                                    <th>Question</th>
                                    <th>Difficulty</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="questionsTableBody">
                                <tr><td colspan="4" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Question Modal -->
    <div class="modal fade" id="questionModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="questionModalTitle">Add Question</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="questionForm">
                        <input type="hidden" id="questionId">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Subject</label>
                                <select class="form-select" id="subject_id" required>
                                    <option value="">Select Subject</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Difficulty</label>
                                <select class="form-select" id="difficulty" required>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Marks</label>
                                <input type="number" step="0.5" class="form-control" id="marks" value="1.0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Question Text</label>
                            <textarea class="form-control" id="question_text" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option A</label>
                                <input type="text" class="form-control" id="option_a" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option B</label>
                                <input type="text" class="form-control" id="option_b" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option C</label>
                                <input type="text" class="form-control" id="option_c" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option D</label>
                                <input type="text" class="form-control" id="option_d" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Correct Answer</label>
                                <select class="form-select" id="correct_answer" required>
                                    <option value="">Select Option</option>
                                    <option value="A">Option A</option>
                                    <option value="B">Option B</option>
                                    <option value="C">Option C</option>
                                    <option value="D">Option D</option>
                                </select>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Explanation (Optional)</label>
                                <textarea class="form-control" id="explanation" rows="2"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveQuestionBtn">Save Question</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'admin') window.location.href = '../student/student-dashboard.html';

        const questionModal = new bootstrap.Modal(document.getElementById('questionModal'));
        let subjectsList = [];
        let allQuestions = [];

        async function loadInitialData() {
            try {
                subjectsList = await fetchApi('/subjects');
                const subjectSelect = document.getElementById('subject_id');
                const filterSelect = document.getElementById('filterSubject');
                
                subjectsList.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    subjectSelect.appendChild(opt);

                    const optFilter = document.createElement('option');
                    optFilter.value = s.id;
                    optFilter.textContent = s.name;
                    filterSelect.appendChild(optFilter);
                });
                await loadQuestions();
            } catch (error) {
                console.error('Failed to load initial data');
            }
        }

        async function loadQuestions() {
            try {
                const filterId = document.getElementById('filterSubject').value;
                const url = filterId ? `/questions?subject_id=${filterId}` : '/questions';
                allQuestions = await fetchApi(url);
                
                const tbody = document.getElementById('questionsTableBody');
                tbody.innerHTML = '';
                
                if (allQuestions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No questions found</td></tr>';
                    return;
                }

                allQuestions.forEach(q => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${q.subject_name}</td>
                        <td title="${q.question_text}">${q.question_text.substring(0, 50)}${q.question_text.length > 50 ? '...' : ''}</td>
                        <td><span class="badge bg-secondary">${q.difficulty}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editQuestion(${q.id})">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('alertBox').textContent = 'Failed to load questions.';
                document.getElementById('alertBox').classList.remove('d-none');
                document.getElementById('alertBox').classList.add('alert-danger');
            }
        }

        function openQuestionModal() {
            document.getElementById('questionForm').reset();
            document.getElementById('questionId').value = '';
            document.getElementById('questionModalTitle').textContent = 'Add Question';
        }

        function editQuestion(id) {
            const q = allQuestions.find(x => x.id === id);
            if (!q) return;

            document.getElementById('questionId').value = q.id;
            document.getElementById('subject_id').value = q.subject_id;
            document.getElementById('difficulty').value = q.difficulty;
            document.getElementById('marks').value = q.marks;
            document.getElementById('question_text').value = q.question_text;
            document.getElementById('option_a').value = q.option_a;
            document.getElementById('option_b').value = q.option_b;
            document.getElementById('option_c').value = q.option_c;
            document.getElementById('option_d').value = q.option_d;
            document.getElementById('correct_answer').value = q.correct_answer;
            document.getElementById('explanation').value = q.explanation || '';
            
            document.getElementById('questionModalTitle').textContent = 'Edit Question';
            questionModal.show();
        }

        document.getElementById('questionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('questionId').value;
            const data = {
                subject_id: document.getElementById('subject_id').value,
                difficulty: document.getElementById('difficulty').value,
                marks: document.getElementById('marks').value,
                question_text: document.getElementById('question_text').value,
                option_a: document.getElementById('option_a').value,
                option_b: document.getElementById('option_b').value,
                option_c: document.getElementById('option_c').value,
                option_d: document.getElementById('option_d').value,
                correct_answer: document.getElementById('correct_answer').value,
                explanation: document.getElementById('explanation').value
            };

            const btn = document.getElementById('saveQuestionBtn');
            btn.disabled = true;

            try {
                if (id) {
                    await fetchApi(`/questions/${id}`, { method: 'PUT', body: JSON.stringify(data) });
                } else {
                    await fetchApi('/questions', { method: 'POST', body: JSON.stringify(data) });
                }
                questionModal.hide();
                loadQuestions();
            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteQuestion(id) {
            if (confirm('Are you sure you want to delete this question?')) {
                try {
                    await fetchApi(`/questions/${id}`, { method: 'DELETE' });
                    loadQuestions();
                } catch (error) {
                    alert(error.message);
                }
            }
        }

        loadInitialData();
    </script>
</body>
</html>
