<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h4 class="text-center mb-4">Student Portal</h4>
            <a href="student-dashboard.html" class="active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="student-exams.html"><i class="bi bi-journal-text me-2"></i> Available Exams</a>
            <a href="exam-history.html"><i class="bi bi-clock-history me-2"></i> Exam History</a>
            <a href="performance.html"><i class="bi bi-graph-up me-2"></i> Performance</a>
            <a href="student-profile.html"><i class="bi bi-person me-2"></i> Profile</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Welcome, <span id="studentName">Student</span></h2>
            </div>

            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="card bg-primary text-white h-100 p-3 shadow-sm border-0">
                        <h5>Total Exams</h5>
                        <h2 id="totalExams">0</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-success text-white h-100 p-3 shadow-sm border-0">
                        <h5>Average Score</h5>
                        <h2 id="avgScore">0%</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-info text-white h-100 p-3 shadow-sm border-0">
                        <h5>Best Score</h5>
                        <h2 id="bestScore">0%</h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-warning text-white h-100 p-3 shadow-sm border-0">
                        <h5>Average Accuracy</h5>
                        <h2 id="avgAccuracy">0%</h2>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Recent Activity</h5>
                        </div>
                        <div class="card-body">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Exam</th>
                                        <th>Date</th>
                                        <th>Score</th>
                                        <th>Result</th>
                                    </tr>
                                </thead>
                                <tbody id="recentActivityBody">
                                    <!-- Populated by JS -->
                                    <tr><td colspan="4" class="text-center text-muted">No recent activity</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Performance Overview</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'student') {
            window.location.href = '../admin/admin-dashboard.html';
        }
        document.getElementById('studentName').textContent = user ? user.name : 'Student';

        // Placeholder for Chart.js
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Correct', 'Wrong', 'Unanswered'],
                datasets: [{
                    data: [1, 1, 1], // Placeholder data
                    backgroundColor: ['#198754', '#dc3545', '#6c757d']
                }]
            }
        });
    </script>
</body>
</html>
