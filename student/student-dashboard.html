<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h4 class="text-center mb-4">Student Portal</h4>
            <a href="student-dashboard.html" class="active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="student-exams.html"><i class="bi bi-journal-text me-2"></i> My Exams</a>
            <a href="student-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="student-analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Welcome, <span id="studentName">Student</span></h2>
            </div>

            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="card bg-primary text-white h-100 p-3 shadow-sm border-0">
                        <h5><i class="bi bi-journal-check me-1"></i> Exams Taken</h5>
                        <h2 id="totalExams"><span class="spinner-border spinner-border-sm" role="status"></span></h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-success text-white h-100 p-3 shadow-sm border-0">
                        <h5><i class="bi bi-percent me-1"></i> Average Score</h5>
                        <h2 id="avgScore"><span class="spinner-border spinner-border-sm" role="status"></span></h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-info text-white h-100 p-3 shadow-sm border-0">
                        <h5><i class="bi bi-trophy me-1"></i> Best Score</h5>
                        <h2 id="bestScore"><span class="spinner-border spinner-border-sm" role="status"></span></h2>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-warning text-white h-100 p-3 shadow-sm border-0">
                        <h5><i class="bi bi-bullseye me-1"></i> Avg Accuracy</h5>
                        <h2 id="avgAccuracy"><span class="spinner-border spinner-border-sm" role="status"></span></h2>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Recent Activity</h5>
                            <a href="student-results.html" class="btn btn-sm btn-outline-primary">View All</a>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Exam</th>
                                        <th>Date</th>
                                        <th>Score</th>
                                        <th>Result</th>
                                    </tr>
                                </thead>
                                <tbody id="recentActivityBody">
                                    <tr><td colspan="4" class="text-center text-muted py-3">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Performance Overview</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if (user && user.role !== 'student') {
            window.location.href = user.role === 'admin' ? '../admin/admin-dashboard.html' : '../teacher/teacher-dashboard.html';
        }
        document.getElementById('studentName').textContent = user ? user.name : 'Student';

        let performanceChart = null;

        async function loadDashboard() {
            try {
                const analytics = await fetchApi('/analytics/student');
                
                document.getElementById('totalExams').textContent = analytics.totalAttempts || 0;
                document.getElementById('avgScore').textContent = (analytics.avgPercentage || 0).toFixed(1) + '%';
                document.getElementById('bestScore').textContent = (analytics.bestPercentage || 0).toFixed(1) + '%';
                document.getElementById('avgAccuracy').textContent = (analytics.avgAccuracy || 0).toFixed(1) + '%';

                // Populate recent activity
                const tbody = document.getElementById('recentActivityBody');
                const attempts = analytics.recentAttempts || [];
                if (attempts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No exam attempts yet. <a href="student-exams.html">Take an exam</a>.</td></tr>';
                } else {
                    tbody.innerHTML = attempts.map(a => `
                        <tr>
                            <td>${a.exam_title || 'N/A'}</td>
                            <td>${a.submitted_at ? new Date(a.submitted_at).toLocaleDateString() : '—'}</td>
                            <td>${(a.percentage || 0).toFixed(1)}%</td>
                            <td><span class="badge ${a.percentage >= (a.passing_percentage || 40) ? 'bg-success' : 'bg-danger'}">${a.percentage >= (a.passing_percentage || 40) ? 'Pass' : 'Fail'}</span></td>
                        </tr>
                    `).join('');
                }

                // Update chart with real data
                const correct = analytics.totalCorrect || 0;
                const wrong = analytics.totalWrong || 0;
                const unanswered = analytics.totalUnanswered || 0;
                updateChart(correct, wrong, unanswered);

            } catch (error) {
                console.error('Dashboard load error:', error.message);
                // Show placeholder chart on error
                document.getElementById('totalExams').textContent = '0';
                document.getElementById('avgScore').textContent = '0%';
                document.getElementById('bestScore').textContent = '0%';
                document.getElementById('avgAccuracy').textContent = '0%';
                document.getElementById('recentActivityBody').innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No activity yet. <a href="student-exams.html">Take an exam</a>.</td></tr>';
                updateChart(0, 0, 0);
            }
        }

        function updateChart(correct, wrong, unanswered) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (performanceChart) performanceChart.destroy();
            performanceChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Correct', 'Wrong', 'Unanswered'],
                    datasets: [{
                        data: [correct || 1, wrong || 0, unanswered || 0],
                        backgroundColor: ['#198754', '#dc3545', '#6c757d']
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
