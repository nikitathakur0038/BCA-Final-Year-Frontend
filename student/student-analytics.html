<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Student Portal</h4>
            <a href="student-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="student-exams.html"><i class="bi bi-journal-check me-2"></i> My Exams</a>
            <a href="student-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="student-analytics.html" class="active"><i class="bi bi-graph-up me-2"></i> Analytics</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <h2 class="mb-4">Performance Analytics</h2>

            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="card text-white bg-primary h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Total Exams Taken</h5>
                            <h2 class="display-4 fw-bold" id="totalExams">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card text-white bg-success h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Exams Passed</h5>
                            <h2 class="display-4 fw-bold" id="passedExams">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card text-white bg-info h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Average Score</h5>
                            <h2 class="display-4 fw-bold" id="avgScore">0%</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Performance Trend</h5>
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Pass/Fail Ratio</h5>
                            <canvas id="ratioChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="mb-3">Exam History</h4>
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Exam Title</th>
                                    <th>Subject</th>
                                    <th>Score</th>
                                    <th>Percentage</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable">
                                <tr><td colspan="7" class="text-center py-4">Loading data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        
        async function loadAnalytics() {
            try {
                const data = await fetchApi('/analytics/student');
                
                // Update stats
                document.getElementById('totalExams').textContent = data.summary.totalExams;
                document.getElementById('passedExams').textContent = data.summary.passed;
                document.getElementById('avgScore').textContent = `${data.summary.averagePercentage}%`;

                // Update Table
                const tbody = document.getElementById('historyTable');
                tbody.innerHTML = '';
                
                if (data.history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No exam history found.</td></tr>';
                    return;
                }

                // Data for charts
                const labels = [];
                const scores = [];

                data.history.reverse().forEach(h => {
                    const date = new Date(h.submitted_at).toLocaleDateString();
                    const passed = parseFloat(h.percentage) >= parseFloat(h.passing_percentage);
                    
                    labels.push(date);
                    scores.push(h.percentage);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td class="fw-bold">${h.exam_title}</td>
                        <td>${h.subject_name}</td>
                        <td>${h.score}</td>
                        <td>${h.percentage}%</td>
                        <td>
                            <span class="badge ${passed ? 'bg-success' : 'bg-danger'}">${passed ? 'Pass' : 'Fail'}</span>
                        </td>
                        <td>
                            <a href="student-results.html?attempt_id=${h.id}" class="btn btn-sm btn-outline-primary">View</a>
                        </td>
                    `;
                    tbody.prepend(tr); // Put newest on top
                });

                // Render Charts
                renderCharts(labels, scores, data.summary.passed, data.summary.totalExams - data.summary.passed);

            } catch (error) {
                alert('Failed to load analytics: ' + error.message);
            }
        }

        function renderCharts(labels, scores, passed, failed) {
            // Trend Line Chart
            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Score Percentage',
                        data: scores,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });

            // Ratio Doughnut Chart
            const ctxRatio = document.getElementById('ratioChart').getContext('2d');
            new Chart(ctxRatio, {
                type: 'doughnut',
                data: {
                    labels: ['Passed', 'Failed'],
                    datasets: [{
                        data: [passed, failed],
                        backgroundColor: ['#198754', '#dc3545']
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '70%'
                }
            });
        }

        loadAnalytics();
    </script>
</body>
</html>
