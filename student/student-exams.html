<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Student Portal</h4>
            <a href="student-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="student-exams.html" class="active"><i class="bi bi-journal-check me-2"></i> My Exams</a>
            <a href="student-results.html"><i class="bi bi-award me-2"></i> Results</a>
            <a href="student-analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <h2 class="mb-4">Available Exams</h2>
            
            <div id="alertBox" class="alert d-none"></div>

            <div class="row" id="examsContainer">
                <div class="col-12 text-center">Loading exams...</div>
            </div>
        </main>
    </div>

    <!-- Exam Info Modal -->
    <div class="modal fade" id="examInfoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalTitle">Exam Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Subject:</strong> <span id="infoSubject"></span></p>
                    <p><strong>Description:</strong> <span id="infoDesc"></span></p>
                    <p><strong>Duration:</strong> <span id="infoDuration"></span> mins</p>
                    <p><strong>Total Questions:</strong> <span id="infoQuestions"></span></p>
                    <p><strong>Marks per Question:</strong> <span id="infoMarks"></span></p>
                    <p><strong>Negative Marks:</strong> <span id="infoNegative"></span></p>
                    <p><strong>Passing %:</strong> <span id="infoPass"></span>%</p>
                    
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i> Once started, the timer cannot be paused. Ensure you have a stable connection.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="startExamBtn">Start Exam</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role !== 'student') window.location.href = '../admin/admin-dashboard.html';

        const infoModal = new bootstrap.Modal(document.getElementById('examInfoModal'));
        let selectedExamId = null;

        async function loadExams() {
            try {
                const exams = await fetchApi('/exams');
                const container = document.getElementById('examsContainer');
                container.innerHTML = '';
                
                if (exams.length === 0) {
                    container.innerHTML = '<div class="col-12"><div class="alert alert-info">No exams available at the moment.</div></div>';
                    return;
                }

                exams.forEach(exam => {
                    const div = document.createElement('div');
                    div.className = 'col-md-6 col-lg-4 mb-4';
                    div.innerHTML = `
                        <div class="card h-100 shadow-sm border-0 exam-card">
                            <div class="card-body">
                                <span class="badge bg-primary mb-2">${exam.subject_name}</span>
                                <h5 class="card-title">${exam.title}</h5>
                                <p class="card-text text-muted small">${exam.description || 'No description provided'}</p>
                                <div class="d-flex justify-content-between mb-3 text-muted small">
                                    <span><i class="bi bi-clock"></i> ${exam.duration_minutes} mins</span>
                                    <span><i class="bi bi-question-circle"></i> ${exam.total_questions} Qs</span>
                                </div>
                                <button class="btn btn-outline-primary w-100" onclick='showExamInfo(${JSON.stringify(exam)})'>
                                    View Details
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('alertBox').textContent = 'Failed to load exams.';
                document.getElementById('alertBox').classList.remove('d-none');
                document.getElementById('alertBox').classList.add('alert-danger');
            }
        }

        function showExamInfo(exam) {
            selectedExamId = exam.id;
            document.getElementById('infoModalTitle').textContent = exam.title;
            document.getElementById('infoSubject').textContent = exam.subject_name;
            document.getElementById('infoDesc').textContent = exam.description || 'N/A';
            document.getElementById('infoDuration').textContent = exam.duration_minutes;
            document.getElementById('infoQuestions').textContent = exam.total_questions;
            document.getElementById('infoMarks').textContent = exam.marks_per_question;
            document.getElementById('infoNegative').textContent = exam.negative_marks;
            document.getElementById('infoPass').textContent = exam.passing_percentage;
            
            infoModal.show();
        }

        document.getElementById('startExamBtn').addEventListener('click', async () => {
            if (!selectedExamId) return;
            try {
                document.getElementById('startExamBtn').disabled = true;
                const res = await fetchApi('/attempts/start', {
                    method: 'POST',
                    body: JSON.stringify({ exam_id: selectedExamId })
                });
                
                // Store attempt details locally temporarily to initialize UI
                sessionStorage.setItem('currentAttempt', JSON.stringify(res));
                window.location.href = `exam-interface.html?attempt_id=${res.attempt_id}`;
            } catch (error) {
                alert(error.message);
                document.getElementById('startExamBtn').disabled = false;
            }
        });

        loadExams();
    </script>
</body>
</html>
