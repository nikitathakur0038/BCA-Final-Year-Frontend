<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="sidebar">
            <h4 class="text-center mb-4">Student Portal</h4>
            <a href="student-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="student-exams.html"><i class="bi bi-journal-check me-2"></i> My Exams</a>
            <a href="student-results.html" class="active"><i class="bi bi-award me-2"></i> Results</a>
            <a href="student-analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
            <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </nav>

        <main class="main-content">
            <h2 class="mb-4">Result Overview</h2>
            
            <div id="resultContent" style="display: none;">
                <div class="row mb-4">
                    <div class="col-md-8 mx-auto">
                        <div class="card shadow border-0 text-center p-4">
                            <h3 class="text-primary mb-3" id="rTitle">Exam Title</h3>
                            <div class="display-1 fw-bold mb-2" id="rScore">--/--</div>
                            <h4 id="rStatus" class="mb-4">Status</h4>
                            
                            <div class="row text-start mt-4">
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="p-3 bg-light rounded text-center">
                                        <h3 class="text-success mb-1" id="rCorrect">0</h3>
                                        <small class="text-muted">Correct</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="p-3 bg-light rounded text-center">
                                        <h3 class="text-danger mb-1" id="rWrong">0</h3>
                                        <small class="text-muted">Wrong</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="p-3 bg-light rounded text-center">
                                        <h3 class="text-warning mb-1" id="rUnanswered">0</h3>
                                        <small class="text-muted">Unanswered</small>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3 mb-3">
                                    <div class="p-3 bg-light rounded text-center">
                                        <h3 class="text-info mb-1" id="rAccuracy">0%</h3>
                                        <small class="text-muted">Accuracy</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <h4 class="mb-3">Detailed Analysis</h4>
                <div id="answersList"></div>
            </div>

            <div id="listContent">
                <!-- If no attempt_id in URL, show list of past results -->
                <div class="alert alert-info">Past results listing will go here.</div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkAuth();
        
        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id');

        async function loadResult(id) {
            try {
                document.getElementById('listContent').style.display = 'none';
                document.getElementById('resultContent').style.display = 'block';
                
                const { attempt, answers } = await fetchApi(`/attempts/${id}/result`);
                
                document.getElementById('rTitle').textContent = attempt.exam_title;
                document.getElementById('rScore').innerHTML = `${attempt.score} <span class="fs-4 text-muted">Marks</span>`;
                
                const passed = parseFloat(attempt.percentage) >= parseFloat(attempt.passing_percentage);
                const statusEl = document.getElementById('rStatus');
                statusEl.textContent = passed ? `PASSED (${attempt.percentage}%)` : `FAILED (${attempt.percentage}%)`;
                statusEl.className = passed ? 'text-success mb-4' : 'text-danger mb-4';

                document.getElementById('rCorrect').textContent = attempt.correct_answers;
                document.getElementById('rWrong').textContent = attempt.wrong_answers;
                document.getElementById('rUnanswered').textContent = attempt.unanswered;
                document.getElementById('rAccuracy').textContent = `${attempt.accuracy}%`;

                // Render Answers
                const container = document.getElementById('answersList');
                answers.forEach((ans, i) => {
                    const isCorrect = ans.is_correct === 1;
                    const isUnanswered = !ans.selected_answer;
                    
                    let bgClass = 'bg-white';
                    let borderClass = isCorrect ? 'border-success' : (isUnanswered ? 'border-warning' : 'border-danger');
                    let iconClass = isCorrect ? 'bi-check-circle-fill text-success' : (isUnanswered ? 'bi-dash-circle-fill text-warning' : 'bi-x-circle-fill text-danger');

                    const div = document.createElement('div');
                    div.className = `card mb-3 shadow-sm ${borderClass}`;
                    div.innerHTML = `
                        <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">Question ${i + 1}</h6>
                            <i class="bi ${iconClass} fs-5"></i>
                        </div>
                        <div class="card-body">
                            <p class="fw-bold">${ans.question_text}</p>
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item ${ans.correct_answer === 'A' ? 'list-group-item-success' : (ans.selected_answer === 'A' ? 'list-group-item-danger' : '')}">A. ${ans.option_a}</li>
                                <li class="list-group-item ${ans.correct_answer === 'B' ? 'list-group-item-success' : (ans.selected_answer === 'B' ? 'list-group-item-danger' : '')}">B. ${ans.option_b}</li>
                                <li class="list-group-item ${ans.correct_answer === 'C' ? 'list-group-item-success' : (ans.selected_answer === 'C' ? 'list-group-item-danger' : '')}">C. ${ans.option_c}</li>
                                <li class="list-group-item ${ans.correct_answer === 'D' ? 'list-group-item-success' : (ans.selected_answer === 'D' ? 'list-group-item-danger' : '')}">D. ${ans.option_d}</li>
                            </ul>
                            <div class="small">
                                <span class="fw-bold">Your Answer:</span> ${ans.selected_answer || 'None'} <br>
                                <span class="fw-bold">Marks Obtained:</span> ${ans.marks_obtained || 0}
                                ${ans.explanation ? `<div class="mt-2 text-muted"><strong>Explanation:</strong> ${ans.explanation}</div>` : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });

            } catch (error) {
                alert('Failed to load result: ' + error.message);
            }
        }

        if (attemptId) {
            loadResult(attemptId);
        } else {
            // Future impl: fetch list of past results and populate listContent
            document.getElementById('listContent').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
        }

    </script>
</body>
</html>
